  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No external fonts, scripts or stylesheets: this page renders evidence
         about a system that is supposed to be inspectable. A page that pulls
         code from a third-party CDN in order to display an attestation is
         asking to be trusted on worse terms than the thing it is describing. -->
    <title>SĀKṢYA — evidence-grade forensic attribution</title>
    <!-- Local files from public/. The .ico is here for the sake of the bare
         /favicon.ico request that browsers and bookmark tools make on their
         own; the PNGs are what a current browser actually picks. Nothing is
         fetched from a third party, for the same reason as the fonts. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
